<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Compass</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg1:#0b0e17; --bg2:#121728; --card:#161c2e; --card2:#1c2338;
  --border:rgba(255,255,255,0.08); --text:#e8ecf6; --sub:#8b93ab;
  --accent:#7c8cff; --accent2:#4fd6c4; --warn:#ffb454; --danger:#ff6b6b;
  --fe:#7c8cff; --be:#4fd6c4; --qa:#ffb454; --pm:#ff6bb0; --ux:#a78bfa; --cs:#5ac8fa; --em:#f472b6; --sales:#34d399; --sec:#f87171;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background: radial-gradient(circle at 20% 20%, #16203a, #0b0e17 60%);
  color:var(--text); min-height:100vh; overflow-x:hidden;
}
.bg-anim{position:fixed; inset:0; z-index:-1; opacity:.5;
  background: linear-gradient(120deg, #1a2240, #0b0e17, #1c1440, #0b0e17);
  background-size: 400% 400%; animation: bgshift 18s ease infinite;}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.app{max-width:1100px; margin:0 auto; padding:28px 20px 80px;}
header{text-align:center; margin-bottom:24px;}
h1{font-size:2.2rem; background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800; letter-spacing:.5px;}
.subtitle{color:var(--sub); margin-top:6px; font-size:1rem;}
.progress-wrap{max-width:600px; margin:20px auto 0; }
.progress-labels{display:flex; justify-content:space-between; font-size:.75rem; color:var(--sub); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em;}
.progress-track{height:8px; border-radius:8px; background:var(--card2); overflow:hidden; border:1px solid var(--border);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .5s ease;}
.stage-pill{display:inline-block; padding:4px 12px; border-radius:20px; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
  background:var(--card2); border:1px solid var(--border); color:var(--accent2); margin-top:10px;}

.screen{animation: fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}

.card{background:linear-gradient(160deg, var(--card), var(--card2)); border:1px solid var(--border); border-radius:18px; padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.35); backdrop-filter: blur(6px);}

/* Intro */
.intro-card{max-width:640px; margin:40px auto; text-align:center;}
.intro-card p{color:var(--sub); margin:14px 0 22px; line-height:1.6;}
.btn{cursor:pointer; border:none; border-radius:12px; padding:13px 26px; font-size:1rem; font-weight:600;
  background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0b0e17; transition:transform .15s ease, box-shadow .15s ease;}
.btn:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(124,140,255,.35);}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

/* Ticket / task card */
.ticket{background:var(--card2); border:1px solid var(--border); border-left:5px solid var(--accent); border-radius:14px;
  padding:18px 20px; margin-bottom:22px; position:relative;}
.ticket .tag{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent2); font-weight:700;}
.ticket h2{font-size:1.2rem; margin-top:6px; line-height:1.4;}
.ticket .meta{margin-top:8px; font-size:.8rem; color:var(--sub);}

/* Role cards / drag */
.role-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:16px;}
.role-card{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center;
  cursor:grab; user-select:none; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  position:relative; overflow:hidden;
}
.role-card::before{content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--role-color,var(--accent));}
.role-card .emoji{font-size:1.6rem; display:block; margin-bottom:6px;}
.role-card .name{font-size:.85rem; font-weight:600;}
.role-card:hover{transform:translateY(-4px); box-shadow:0 10px 24px rgba(0,0,0,.4); border-color:var(--role-color,var(--accent));}
.role-card.dragging{opacity:.35;}
.role-card.used{opacity:.3; pointer-events:none;}

.drop-zone{
  margin-top:20px; min-height:78px; border:2px dashed var(--border); border-radius:14px;
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; padding:12px;
  color:var(--sub); font-size:.9rem; transition: background .2s ease, border-color .2s ease;
}
.drop-zone.over{border-color:var(--accent); background:rgba(124,140,255,.08);}
.drop-zone .placed{background:var(--card2); border:1px solid var(--accent); border-radius:10px; padding:8px 14px; font-weight:600; font-size:.85rem; animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1);} }
@keyframes pop{0%{transform:scale(.6); opacity:0;}100%{transform:scale(1); opacity:1;}}

/* Stage 2 sequence slots */
.seq-track{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:18px;}
.seq-slot{width:130px; min-height:64px; border:2px dashed var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:.8rem; color:var(--sub); background:var(--card2); text-align:center; padding:6px; transition: border-color .2s ease, background .2s ease;}
.seq-slot.over{border-color:var(--accent2);}
.seq-slot.filled{border-style:solid; color:var(--text); font-weight:600;}
.seq-arrow{color:var(--sub); font-size:1.2rem;}

/* Stage3 dept assign */
.dept-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:16px;}
.dept-card{background:var(--card); border:2px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer;
  transition:all .18s ease; position:relative;}
.dept-card .emoji{font-size:1.6rem; display:block; margin-bottom:6px;}
.dept-card.selected{border-color:var(--accent2); background:rgba(79,214,196,.12); box-shadow:0 0 0 3px rgba(79,214,196,.15);}
.dept-card .badge{position:absolute; top:6px; right:8px; background:var(--accent2); color:#0b0e17; font-size:.7rem; font-weight:800;
  border-radius:50%; width:20px; height:20px; display:none; align-items:center; justify-content:center;}
.dept-card.selected .badge{display:flex;}

/* Reveal */
.reveal{margin-top:22px; border-top:1px solid var(--border); padding-top:18px; animation:fadeIn .5s ease;}
.reveal .row{margin-bottom:12px;}
.reveal .label{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent2); font-weight:700; margin-bottom:4px;}
.reveal .value{color:var(--text); line-height:1.55;}
.chip{display:inline-block; background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:.8rem; margin:2px 4px 2px 0;}

.flow-anim{display:flex; align-items:center; gap:6px; margin-top:14px; flex-wrap:wrap;}
.flow-node{background:var(--card2); border:1px solid var(--accent); border-radius:10px; padding:8px 12px; font-size:.8rem; font-weight:600; opacity:0; transform:translateY(10px);}
.flow-node.show{animation: nodeIn .4s ease forwards;}
@keyframes nodeIn{to{opacity:1; transform:translateY(0);}}
.flow-arrow{color:var(--accent2); opacity:0;}
.flow-arrow.show{animation: nodeIn .4s ease forwards;}

.actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

/* Score screen */
.score-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
@media(max-width:640px){.score-grid{grid-template-columns:1fr;}}
.bar-row{margin-bottom:16px;}
.bar-row .lbl{display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:6px;}
.bar-track{height:14px; background:var(--card2); border-radius:8px; overflow:hidden; border:1px solid var(--border);}
.bar-fill{height:100%; border-radius:8px; width:0%; transition:width 1s cubic-bezier(.2,.8,.2,1); background:linear-gradient(90deg,var(--accent),var(--accent2));}

.reflection ul{margin:10px 0 0 18px; color:var(--text); line-height:1.7;}
.reflection h3{color:var(--accent2); margin-top:18px; font-size:.95rem; text-transform:uppercase; letter-spacing:.05em;}
.insight-box{margin-top:20px; background:rgba(124,140,255,.1); border:1px solid rgba(124,140,255,.3); border-radius:14px; padding:16px 18px; font-style:italic;}

.confetti{position:fixed; inset:0; pointer-events:none; z-index:50;}
.confetti span{position:absolute; top:-10px; font-size:1.2rem; animation: fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.2;}}

footer.nav{display:flex; justify-content:space-between; margin-top:26px; max-width:1100px; margin-left:auto; margin-right:auto; padding:0 20px;}
.step-dots{display:flex; gap:6px; justify-content:center; margin-top:10px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--border);}
.dot.active{background:var(--accent2);}
.dot.done{background:var(--accent);}
</style>
</head>
<body>
<div class="bg-anim"></div>
<div class="app" id="app"></div>

<script>
/* ============ DATA ============ */
const ROLES = [
  {id:'fe', name:'Frontend Developer', emoji:'🖥️', color:'var(--fe)'},
  {id:'be', name:'Backend Developer', emoji:'🛠️', color:'var(--be)'},
  {id:'qa', name:'QA Engineer', emoji:'🧪', color:'var(--qa)'},
  {id:'pm', name:'Product Manager', emoji:'🗺️', color:'var(--pm)'},
  {id:'ux', name:'UX Designer', emoji:'🎨', color:'var(--ux)'},
  {id:'cs', name:'Customer Support', emoji:'💬', color:'var(--cs)'},
  {id:'em', name:'Engineering Manager', emoji:'🧭', color:'var(--em)'},
  {id:'sales', name:'Sales', emoji:'📈', color:'var(--sales)'},
  {id:'sec', name:'Security Engineer', emoji:'🔒', color:'var(--sec)'},
];
const R = id => ROLES.find(r=>r.id===id);

// STAGE 1: Ownership
const STAGE1 = [
  {task:"A customer reports that payments fail only on iPhones.", owner:'fe', why:"Payment failures isolated to a specific device/browser almost always trace back to how the client renders and calls the payment flow, which is the Frontend Developer's domain.", assist:['qa','be'], meta:"Priority: High · Reported via: Support ticket"},
  {task:"The database is timing out under heavy traffic during a sale event.", owner:'be', why:"Database performance under load sits squarely with whoever owns the server-side data layer and query performance — the Backend Developer.", assist:['em','qa'], meta:"Priority: Critical · Reported via: Monitoring alert"},
  {task:"A new checkout flow needs to be tested before release.", owner:'qa', why:"Verifying a flow works correctly before it reaches customers is the core responsibility of QA — catching issues before they become incidents.", assist:['fe','be'], meta:"Priority: Medium · Reported via: Release checklist"},
  {task:"Users are confused about where to find the settings menu.", owner:'ux', why:"Confusion about navigation and discoverability is a usability problem, which is the UX Designer's core responsibility — not a bug to fix in code first.", assist:['pm','fe'], meta:"Priority: Medium · Reported via: User feedback survey"},
  {task:"The team needs to decide which features ship in the next release.", owner:'pm', why:"Prioritizing what gets built and when is a product decision that balances user needs, business goals, and engineering capacity — owned by the Product Manager.", assist:['em','ux'], meta:"Priority: High · Reported via: Roadmap planning"},
  {task:"A customer is angry about a billing error and wants a refund today.", owner:'cs', why:"Direct customer communication and resolving individual account issues is owned by Customer Support, who can escalate if the root cause needs engineering.", assist:['be','sales'], meta:"Priority: High · Reported via: Live chat"},
  {task:"Two engineers disagree on the technical approach for a new service.", owner:'em', why:"Resolving technical direction conflicts and unblocking the team is a core responsibility of the Engineering Manager.", assist:['be','fe'], meta:"Priority: Medium · Reported via: Team standup"},
  {task:"A security researcher reports a potential vulnerability in the login API.", owner:'sec', why:"Vulnerability triage and remediation is owned by the Security Engineer, who assesses risk and coordinates a fix.", assist:['be','em'], meta:"Priority: Critical · Reported via: Responsible disclosure"},
  {task:"A big client wants a custom pricing plan before signing a contract.", owner:'sales', why:"Negotiating deal terms and pricing with a prospective client is owned by Sales, who understands the commercial relationship.", assist:['pm','cs'], meta:"Priority: High · Reported via: Deal pipeline"},
  {task:"The mobile app crashes immediately after the latest update.", owner:'qa', why:"A crash that reached production signals a gap in pre-release verification — QA owns triaging and confirming the fix before re-release, working closely with engineering.", assist:['fe','be'], meta:"Priority: Critical · Reported via: Crash reports"},
];

// STAGE 2: Routing
const STAGE2 = [
  {task:"A customer reports a bug through live chat that turns out to be a real backend issue.", steps:['cs','qa','be','pm','cs'],
   why:"Support first confirms the issue is real, QA reproduces and documents it precisely, Backend fixes the root cause, PM verifies it fits the release, and Support closes the loop with the customer."},
  {task:"A designer wants to ship a redesigned onboarding flow.", steps:['ux','pm','fe','qa'],
   why:"UX designs the flow, PM signs off on scope and priority, Frontend builds it, and QA verifies it works before release — a lean four-step path since backend isn't involved."},
  {task:"An engineer discovers a security flaw while working on an unrelated feature.", steps:['sec','em','be','qa'],
   why:"Security triages severity first, the Engineering Manager reprioritizes the team's work, Backend implements the fix, and QA confirms it's resolved before closing."},
  {task:"Sales closes a deal that requires a custom integration not yet built.", steps:['sales','pm','be','qa','cs'],
   why:"Sales hands off the commitment, PM scopes what's feasible, Backend builds the integration, QA validates it, and Support helps the client through go-live."},
  {task:"A customer support ticket reveals users don't understand a core feature.", steps:['cs','ux','pm'],
   why:"Support flags the confusion pattern, UX researches and proposes a clearer design, and PM decides whether and when to prioritize the change — only three steps since it may not need new code yet."},
];

// STAGE 3: Collaboration
const STAGE3 = [
  {task:"Customer satisfaction suddenly drops after the latest release.",
   primary:'pm', support:['qa','cs','be'],
   why:"PM owns diagnosing what changed and coordinating the response, QA investigates what may have slipped through testing, Support surfaces real user complaints, and Backend checks for underlying performance or bugs.",
   flow:"Customer Support → Product Manager → QA & Backend (parallel investigation) → Product Manager → Customer Support"},
  {task:"Sales increase dramatically after a marketing push.",
   primary:'be', support:['em','qa','sales'],
   why:"Backend must ensure infrastructure scales with demand, the Engineering Manager reallocates resources to handle load, QA verifies stability under stress, and Sales keeps momentum with customers.",
   flow:"Sales → Engineering Manager → Backend & QA (scale & verify) → Sales"},
  {task:"Negative reviews appear online criticizing the product's reliability.",
   primary:'cs', support:['pm','qa','ux'],
   why:"Support triages and responds to public concerns, PM assesses whether it reflects a real product gap, QA checks for unresolved reliability issues, and UX evaluates if friction is driving the perception.",
   flow:"Customer Support → Product Manager → QA & UX (root cause) → Product Manager → Customer Support (public response)"},
  {task:"A major feature is delayed just before its announced launch date.",
   primary:'em', support:['pm','be','fe'],
   why:"The Engineering Manager assesses what's blocking delivery and reallocates the team, PM decides whether to adjust scope or timeline, and Frontend/Backend focus on the critical path to ship.",
   flow:"Engineering Manager → Product Manager (scope decision) → Frontend & Backend (critical path) → Product Manager"},
];

/* ============ STATE ============ */
let state = {
  screen:'intro', // intro, s1, s2, s3, results
  s1Index:0, s2Index:0, s3Index:0,
  s1Answers:[], s2Answers:[], s3Answers:[],
  totalSteps: 3+3+3,
};

function totalDone(){
  return Math.min(state.s1Index, 3) + Math.min(state.s2Index, 3) + Math.min(state.s3Index, 3);
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen==='intro') return renderIntro(app);
  if(state.screen==='s1') return renderStage1(app);
  if(state.screen==='s2') return renderStage2(app);
  if(state.screen==='s3') return renderStage3(app);
  if(state.screen==='results') return renderResults(app);
}

function header(stageLabel){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <header>
      <h1>🧭 Task Compass</h1>
      <div class="subtitle">Learn how work flows through real organizations.</div>
      <div class="stage-pill">Tech Company Simulation</div>
      <div class="progress-wrap">
        <div class="progress-labels"><span>${stageLabel}</span><span>${totalDone()}/9 scenarios</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${(totalDone()/9*100)}%"></div></div>
      </div>
    </header>
  `;
  return wrap;
}

/* ============ INTRO ============ */
function renderIntro(app){
  const div = document.createElement('div');
  div.className='screen';
  div.appendChild(header('Getting Started'));
  div.innerHTML += `
    <div class="card intro-card">
      <div style="font-size:2.4rem;">🏢</div>
      <h2 style="margin-top:10px;">Welcome to a Tech Company</h2>
      <p>You'll step into the flow of a real product organization. Across three stages you'll decide who owns problems, how work should be routed, and how teams collaborate on bigger challenges. There are no simple right or wrong answers here — only reasoning about how organizations actually work.</p>
      <button class="btn" id="startBtn">Start Simulation →</button>
    </div>
  `;
  app.appendChild(div);
  document.getElementById('startBtn').onclick = ()=>{ state.screen='s1'; render(); };
}

/* ============ DRAG HELPERS ============ */
function makeRoleCard(role, disabledIds=[]){
  const el = document.createElement('div');
  el.className='role-card';
  el.style.setProperty('--role-color', role.color);
  el.draggable = true;
  el.dataset.role = role.id;
  el.innerHTML = `<span class="emoji">${role.emoji}</span><span class="name">${role.name}</span>`;
  el.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', role.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
  return el;
}

/* ============ STAGE 1 ============ */
function renderStage1(app){
  if(state.s1Index>=3){ state.screen='s2'; return render(); }
  const data = STAGE1[state.s1Index];
  const div = document.createElement('div');
  div.className='screen';
  div.appendChild(header('Stage 1 · Who Owns This?'));

  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <div class="ticket">
      <div class="tag">🎫 Incoming Task</div>
      <h2>${data.task}</h2>
      <div class="meta">${data.meta}</div>
    </div>
    <p style="color:var(--sub); font-size:.9rem;">Drag the role that should <strong style="color:var(--text)">primarily own</strong> this task into the slot below.</p>
    <div class="drop-zone" id="dropZone">Drop the owning role here</div>
    <div class="role-grid" id="roleGrid"></div>
    <div id="revealArea"></div>
    <div class="actions" id="actionsArea"></div>
  `;
  div.appendChild(card);
  app.appendChild(div);

  const roleGrid = card.querySelector('#roleGrid');
  const shuffled = [...ROLES].sort(()=>Math.random()-0.5).slice(0,7);
  if(!shuffled.find(r=>r.id===data.owner)) shuffled[0]=R(data.owner);
  shuffled.forEach(r=> roleGrid.appendChild(makeRoleCard(r)));

  const dropZone = card.querySelector('#dropZone');
  let placedRole = null;
  dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e=>{
    e.preventDefault(); dropZone.classList.remove('over');
    const rid = e.dataTransfer.getData('text/plain');
    placedRole = rid;
    const role = R(rid);
    dropZone.innerHTML = `<div class="placed">${role.emoji} ${role.name}</div>`;
    renderActions();
  });
  // click-to-place fallback for touch devices
  roleGrid.querySelectorAll('.role-card').forEach(card2=>{
    card2.addEventListener('click', ()=>{
      placedRole = card2.dataset.role;
      const role = R(placedRole);
      dropZone.innerHTML = `<div class="placed">${role.emoji} ${role.name}</div>`;
      renderActions();
    });
  });

  function renderActions(){
    const actions = card.querySelector('#actionsArea');
    actions.innerHTML = `<button class="btn" id="submitBtn">Submit Decision</button>`;
    actions.querySelector('#submitBtn').onclick = submit;
  }

  function submit(){
    if(!placedRole) return;
    const correct = placedRole === data.owner;
    state.s1Answers.push({correct, placed:placedRole, taskIndex:state.s1Index});
    const owner = R(data.owner);
    const reveal = card.querySelector('#revealArea');
    reveal.innerHTML = `
      <div class="reveal">
        <div class="row"><div class="label">✓ Primary Owner</div><div class="value">${owner.emoji} ${owner.name}</div></div>
        <div class="row"><div class="label">Why they own it</div><div class="value">${data.why}</div></div>
        <div class="row"><div class="label">Who may assist</div><div class="value">${data.assist.map(id=>`<span class="chip">${R(id).emoji} ${R(id).name}</span>`).join('')}</div></div>
      </div>
    `;
    const actions = card.querySelector('#actionsArea');
    actions.innerHTML = `<button class="btn" id="nextBtn">Continue →</button>`;
    actions.querySelector('#nextBtn').onclick = ()=>{ state.s1Index++; render(); };
    // disable further interaction
    roleGrid.querySelectorAll('.role-card').forEach(c=>c.classList.add('used'));
    dropZone.style.pointerEvents='none';
  }
}

/* ============ STAGE 2 ============ */
function renderStage2(app){
  if(state.s2Index>=3){ state.screen='s3'; return render(); }
  const data = STAGE2[state.s2Index];
  const div = document.createElement('div');
  div.className='screen';
  div.appendChild(header('Stage 2 · Task Routing'));

  const card = document.createElement('div');
  card.className='card';
  const numSlots = data.steps.length;
  let slotsHtml = '';
  for(let i=0;i<numSlots;i++){
    slotsHtml += `<div class="seq-slot" data-idx="${i}">Step ${i+1}</div>`;
    if(i<numSlots-1) slotsHtml += `<div class="seq-arrow">→</div>`;
  }
  card.innerHTML = `
    <div class="ticket">
      <div class="tag">🔄 Incoming Work</div>
      <h2>${data.task}</h2>
      <div class="meta">Build the ${numSlots}-step workflow this task should follow.</div>
    </div>
    <div class="seq-track" id="seqTrack">${slotsHtml}</div>
    <p style="color:var(--sub); font-size:.85rem; margin-top:14px;">Drag roles into the slots in the order work should flow.</p>
    <div class="role-grid" id="roleGrid2"></div>
    <div id="revealArea2"></div>
    <div class="actions" id="actionsArea2"></div>
  `;
  div.appendChild(card);
  app.appendChild(div);

  const roleGrid = card.querySelector('#roleGrid2');
  // pool: correct roles (deduped) + a couple distractors
  let pool = [...new Set(data.steps)].map(R);
  const distractors = ROLES.filter(r=>!pool.includes(r)).sort(()=>Math.random()-0.5).slice(0,2);
  pool = [...pool, ...distractors].sort(()=>Math.random()-0.5);
  pool.forEach(r=> roleGrid.appendChild(makeRoleCard(r)));

  const slots = Array.from(card.querySelectorAll('.seq-slot'));
  const placed = new Array(numSlots).fill(null);

  slots.forEach(slot=>{
    slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
    slot.addEventListener('drop', e=>{
      e.preventDefault(); slot.classList.remove('over');
      const rid = e.dataTransfer.getData('text/plain');
      const idx = parseInt(slot.dataset.idx);
      placed[idx] = rid;
      const role = R(rid);
      slot.textContent = `${role.emoji} ${role.name}`;
      slot.classList.add('filled');
      checkComplete();
    });
  });

  let selectedRoleId = null;
  roleGrid.querySelectorAll('.role-card').forEach(rc=>{
    rc.addEventListener('click', ()=>{
      selectedRoleId = rc.dataset.role;
      const emptySlot = slots.find(s=> !s.classList.contains('filled'));
      if(emptySlot){
        const idx = parseInt(emptySlot.dataset.idx);
        placed[idx]=selectedRoleId;
        const role = R(selectedRoleId);
        emptySlot.textContent = `${role.emoji} ${role.name}`;
        emptySlot.classList.add('filled');
        checkComplete();
      }
    });
  });

  function checkComplete(){
    if(placed.every(p=>p!==null)){
      const actions = card.querySelector('#actionsArea2');
      actions.innerHTML = `<button class="btn" id="submitBtn2">Submit Workflow</button>`;
      actions.querySelector('#submitBtn2').onclick = submit;
    }
  }

  function submit(){
    const correct = JSON.stringify(placed) === JSON.stringify(data.steps);
    const partiallyCorrect = !correct && placed.filter((p,i)=>p===data.steps[i]).length >= Math.ceil(numSlots/2);
    state.s2Answers.push({correct, partiallyCorrect, taskIndex:state.s2Index});

    // animate flow
    const reveal = card.querySelector('#revealArea2');
    const flowHtml = data.steps.map((s,i)=>{
      const role = R(s);
      return `<div class="flow-node" data-i="${i}">${role.emoji} ${role.name}</div>` + (i<data.steps.length-1?`<div class="flow-arrow" data-a="${i}">→</div>`:'');
    }).join('');
    reveal.innerHTML = `
      <div class="reveal">
        <div class="label">✓ Correct Workflow</div>
        <div class="flow-anim" id="flowAnim">${flowHtml}</div>
        <div class="row" style="margin-top:14px;"><div class="label">Why this order</div><div class="value">${data.why}</div></div>
      </div>
    `;
    const nodes = reveal.querySelectorAll('.flow-node, .flow-arrow');
    nodes.forEach((n,i)=> setTimeout(()=> n.classList.add('show'), i*180));

    const actions = card.querySelector('#actionsArea2');
    actions.innerHTML = `<button class="btn" id="nextBtn2">Continue →</button>`;
    actions.querySelector('#nextBtn2').onclick = ()=>{ state.s2Index++; render(); };
    roleGrid.querySelectorAll('.role-card').forEach(c=>c.classList.add('used'));
  }
}

/* ============ STAGE 3 ============ */
function renderStage3(app){
  if(state.s3Index>=3){ state.screen='results'; return render(); }
  const data = STAGE3[state.s3Index];
  const div = document.createElement('div');
  div.className='screen';
  div.appendChild(header('Stage 3 · Collaboration Challenge'));

  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <div class="ticket" style="border-left-color:var(--warn);">
      <div class="tag" style="color:var(--warn);">⚠️ Complex Situation</div>
      <h2>${data.task}</h2>
      <div class="meta">Select up to 4 departments/roles who should be involved. Order matters — first pick = primary owner.</div>
    </div>
    <div class="dept-grid" id="deptGrid"></div>
    <div id="revealArea3"></div>
    <div class="actions" id="actionsArea3"></div>
  `;
  div.appendChild(card);
  app.appendChild(div);

  const deptGrid = card.querySelector('#deptGrid');
  const shuffledRoles = [...ROLES].sort(()=>Math.random()-0.5);
  const selections = [];
  shuffledRoles.forEach(r=>{
    const el = document.createElement('div');
    el.className='dept-card';
    el.style.setProperty('--role-color', r.color);
    el.innerHTML = `<span class="emoji">${r.emoji}</span><div class="name" style="font-size:.85rem; font-weight:600;">${r.name}</div><div class="badge"></div>`;
    el.addEventListener('click', ()=>{
      const idx = selections.indexOf(r.id);
      if(idx>-1){
        selections.splice(idx,1);
        el.classList.remove('selected');
      } else {
        if(selections.length>=4) return;
        selections.push(r.id);
        el.classList.add('selected');
      }
      // update badges (order numbers)
      deptGrid.querySelectorAll('.dept-card').forEach(dc=>{
        const rid = dc.dataset.role;
        const pos = selections.indexOf(rid);
        const badge = dc.querySelector('.badge');
        badge.textContent = pos>-1 ? pos+1 : '';
      });
      actions.innerHTML = selections.length>0 ? `<button class="btn" id="submitBtn3">Submit Assignment (${selections.length} selected)</button>` : '';
      if(selections.length>0) actions.querySelector('#submitBtn3').onclick = submit;
    });
    el.dataset.role = r.id;
    deptGrid.appendChild(el);
  });

  const actions = card.querySelector('#actionsArea3');

  function submit(){
    const primary = selections[0];
    const primaryCorrect = primary === data.primary;
    const supportOverlap = selections.slice(1).filter(id=> data.support.includes(id)).length;
    state.s3Answers.push({primaryCorrect, supportOverlap, count:selections.length, taskIndex:state.s3Index});

    const reveal = card.querySelector('#revealArea3');
    reveal.innerHTML = `
      <div class="reveal">
        <div class="row"><div class="label">Primary Owner</div><div class="value">${R(data.primary).emoji} ${R(data.primary).name}</div></div>
        <div class="row"><div class="label">Supporting Teams</div><div class="value">${data.support.map(id=>`<span class="chip">${R(id).emoji} ${R(id).name}</span>`).join('')}</div></div>
        <div class="row"><div class="label">Reasoning</div><div class="value">${data.why}</div></div>
        <div class="row"><div class="label">Possible Communication Flow</div><div class="value">${data.flow}</div></div>
      </div>
    `;
    actions.innerHTML = `<button class="btn" id="nextBtn3">Continue →</button>`;
    actions.querySelector('#nextBtn3').onclick = ()=>{ state.s3Index++; render(); };
    deptGrid.querySelectorAll('.dept-card').forEach(c=> c.style.pointerEvents='none');
  }
}

/* ============ RESULTS ============ */
function computeScores(){
  // Ownership: stage1 accuracy
  const s1Correct = state.s1Answers.filter(a=>a.correct).length;
  const ownership = Math.round((s1Correct/3)*100);

  // Workflow Thinking: stage2 accuracy (full + partial credit)
  let wfScore = 0;
  state.s2Answers.forEach(a=>{ if(a.correct) wfScore+=1; else if(a.partiallyCorrect) wfScore+=0.5; });
  const workflow = Math.round((wfScore/3)*100);

  // Collaboration: stage3 support overlap + reasonable count (2-4)
  let collabScore = 0;
  state.s3Answers.forEach(a=>{
    let s = 0;
    s += Math.min(a.supportOverlap,3)/3 * 0.7; // up to .7 for finding right supporters
    if(a.count>=2) s += 0.3; // rewards recognizing it's not a solo job
    collabScore += s;
  });
  const collaboration = Math.round((collabScore/3)*100);

  // Delegation: derived — did they involve assist roles conceptually?
  // Approximate with: stage1 correct owner AND willingness in stage3 to select multiple (proxy for not hoarding ownership)
  let delegSignal = 0;
  state.s3Answers.forEach(a=>{ if(a.count>=2 && a.count<=4) delegSignal+=1; });
  state.s1Answers.forEach(a=>{ if(a.correct) delegSignal += 0.3; });
  const delegation = Math.min(100, Math.round((delegSignal/(3+3*0.3))*100));

  return {ownership, workflow, collaboration, delegation};
}

function renderResults(app){
  const scores = computeScores();
  const div = document.createElement('div');
  div.className='screen';
  div.appendChild(header('Complete'));

  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <div style="text-align:center;">
      <div style="font-size:2.4rem;">🎉</div>
      <h2 style="margin-top:8px;">Simulation Complete</h2>
      <p style="color:var(--sub); margin-top:6px;">Here's how your understanding of organizational flow shaped up.</p>
    </div>
    <div class="score-grid">
      <div>
        <div class="bar-row">
          <div class="lbl"><span>Ownership</span><span>${scores.ownership}%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-ownership"></div></div>
        </div>
        <div class="bar-row">
          <div class="lbl"><span>Delegation</span><span>${scores.delegation}%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-delegation"></div></div>
        </div>
        <div class="bar-row">
          <div class="lbl"><span>Collaboration</span><span>${scores.collaboration}%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-collaboration"></div></div>
        </div>
        <div class="bar-row">
          <div class="lbl"><span>Workflow Thinking</span><span>${scores.workflow}%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-workflow"></div></div>
        </div>
      </div>
      <div id="radarWrap" style="display:flex; align-items:center; justify-content:center;">
        <svg id="radar" width="260" height="260" viewBox="0 0 260 260"></svg>
      </div>
    </div>

    <div class="reflection">
      <h3>What you understood well</h3>
      <ul id="wentWell"></ul>
      <h3>Where you tended to over-assign responsibility</h3>
      <ul id="overAssign"></ul>
      <h3>Where you underestimated collaboration</h3>
      <ul id="underCollab"></ul>
      <div class="insight-box" id="insightBox"></div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="restartBtn">Restart Simulation</button>
    </div>
  `;
  div.appendChild(card);
  app.appendChild(div);

  // animate bars
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      card.querySelector('#bar-ownership').style.width = scores.ownership+'%';
      card.querySelector('#bar-delegation').style.width = scores.delegation+'%';
      card.querySelector('#bar-collaboration').style.width = scores.collaboration+'%';
      card.querySelector('#bar-workflow').style.width = scores.workflow+'%';
    }, 100);
  });

  drawRadar(card.querySelector('#radar'), scores);

  // reflection text (varied, non-absolute language)
  const wentWell = card.querySelector('#wentWell');
  const overAssign = card.querySelector('#overAssign');
  const underCollab = card.querySelector('#underCollab');
  const insight = card.querySelector('#insightBox');

  const strengths = [];
  if(scores.ownership>=66) strengths.push("You generally identified the right primary owner for focused, single-domain tasks.");
  if(scores.workflow>=66) strengths.push("You tended to sequence work in an order that reflects how tickets actually move between teams.");
  if(scores.collaboration>=66) strengths.push("You recognized when a situation needed more than one team to respond well.");
  if(strengths.length===0) strengths.push("You engaged with each scenario thoughtfully, which is a strong starting point for thinking about organizational flow.");
  strengths.forEach(s=>{ const li=document.createElement('li'); li.textContent=s; wentWell.appendChild(li); });

  const over = [];
  if(scores.collaboration<60) over.push("In some complex situations, a single-role response may have felt sufficient — but many of these usually benefit from more hands.");
  if(scores.delegation<60) over.push("There were moments where involving an assisting role earlier might have eased the load on the primary owner.");
  if(over.length===0) over.push("You didn't show a strong pattern of over-assigning — your ownership calls were reasonably balanced.");
  over.forEach(s=>{ const li=document.createElement('li'); li.textContent=s; overAssign.appendChild(li); });

  const under = [];
  if(scores.collaboration<70) under.push("Some multi-team situations may have been treated as more solvable by one department than they typically are in practice.");
  if(scores.workflow<70) under.push("A few workflows may have skipped a handoff step that teams usually rely on to catch issues early.");
  if(under.length===0) under.push("You consistently reached for multiple perspectives in ambiguous situations — a pattern that tends to serve real teams well.");
  under.forEach(s=>{ const li=document.createElement('li'); li.textContent=s; underCollab.appendChild(li); });

  const insights = [
    "Many real workplace problems are solved by teams rather than individuals.",
    "Ownership doesn't mean working alone — it usually means coordinating the people who can help.",
    "The order work flows through an organization often matters as much as who's involved.",
    "Escalation isn't a failure — it's often how complex problems get the right attention faster."
  ];
  insight.textContent = "💡 " + insights[Math.floor(Math.random()*insights.length)];

  card.querySelector('#restartBtn').onclick = ()=>{
    state = {screen:'intro', s1Index:0,s2Index:0,s3Index:0, s1Answers:[],s2Answers:[],s3Answers:[]};
    render();
  };

  celebrate();
}

function drawRadar(svg, scores){
  const dims = [
    {k:'ownership', label:'Ownership'},
    {k:'delegation', label:'Delegation'},
    {k:'collaboration', label:'Collaboration'},
    {k:'workflow', label:'Workflow'}
  ];
  const cx=130, cy=130, R=90;
  const n = dims.length;
  const ns = 'http://www.w3.org/2000/svg';
  function point(i, value){
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const r = (value/100)*R;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  }
  // grid rings
  [0.25,0.5,0.75,1].forEach(f=>{
    const ring = document.createElementNS(ns,'polygon');
    const pts = dims.map((d,i)=>{
      const angle=(Math.PI*2*i/n)-Math.PI/2;
      return `${cx+R*f*Math.cos(angle)},${cy+R*f*Math.sin(angle)}`;
    }).join(' ');
    ring.setAttribute('points', pts);
    ring.setAttribute('fill','none');
    ring.setAttribute('stroke','rgba(255,255,255,0.08)');
    svg.appendChild(ring);
  });
  // axis lines + labels
  dims.forEach((d,i)=>{
    const angle=(Math.PI*2*i/n)-Math.PI/2;
    const x2 = cx+R*Math.cos(angle), y2=cy+R*Math.sin(angle);
    const line = document.createElementNS(ns,'line');
    line.setAttribute('x1',cx); line.setAttribute('y1',cy);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke','rgba(255,255,255,0.08)');
    svg.appendChild(line);
    const lx = cx+(R+22)*Math.cos(angle), ly=cy+(R+22)*Math.sin(angle);
    const text = document.createElementNS(ns,'text');
    text.setAttribute('x',lx); text.setAttribute('y',ly);
    text.setAttribute('fill','#8b93ab'); text.setAttribute('font-size','10');
    text.setAttribute('text-anchor','middle'); text.setAttribute('dominant-baseline','middle');
    text.textContent = d.label;
    svg.appendChild(text);
  });
  // data polygon
  const pts = dims.map((d,i)=> point(i, scores[d.k]).join(',')).join(' ');
  const poly = document.createElementNS(ns,'polygon');
  poly.setAttribute('points', pts);
  poly.setAttribute('fill','rgba(124,140,255,0.28)');
  poly.setAttribute('stroke','#7c8cff');
  poly.setAttribute('stroke-width','2');
  svg.appendChild(poly);
  dims.forEach((d,i)=>{
    const [x,y] = point(i, scores[d.k]);
    const dot = document.createElementNS(ns,'circle');
    dot.setAttribute('cx',x); dot.setAttribute('cy',y); dot.setAttribute('r',4);
    dot.setAttribute('fill','#4fd6c4');
    svg.appendChild(dot);
  });
}

function celebrate(){
  const c = document.createElement('div');
  c.className='confetti';
  const emojis = ['🎉','✨','🎊','⭐'];
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (2.5+Math.random()*2)+'s';
    s.style.animationDelay = (Math.random()*0.6)+'s';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=> c.remove(), 5000);
}

/* ============ INIT ============ */
render();
</script>
</body>
</html>
