<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tank — AI Pitch Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#071129;
    --bg-alt:#0a1730;
    --surface:#0f2040;
    --surface-2:#152a4d;
    --gold:#D4AF37;
    --gold-bright:#F2C94C;
    --teal:#22C3B6;
    --teal-dim:#17948B;
    --green:#43C97F;
    --violet:#9B8CFF;
    --red:#E5484D;
    --text:#EAF0F7;
    --text-dim:#9FB0C7;
    --text-faint:#5F7290;
    --border:rgba(234,240,247,0.09);
    --border-bright:rgba(234,240,247,0.18);
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(34,195,182,0.14), transparent 60%),
      radial-gradient(ellipse 900px 600px at 90% 0%, rgba(212,175,55,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  ::selection{ background: rgba(212,175,55,0.35); }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  a{color:var(--teal);}
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }

  /* ---------- Shell ---------- */
  #app{ max-width:1180px; margin:0 auto; padding:28px 20px 90px; }

  .brandbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 4px 26px;
    border-bottom:1px solid var(--border);
    margin-bottom:34px;
    flex-wrap:wrap; gap:14px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:40px;height:40px;border-radius:50%;
    background: conic-gradient(from 210deg, var(--teal), var(--gold), var(--violet), var(--teal));
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.05), 0 8px 20px rgba(34,195,182,0.25);
  }
  .brand-text .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); }
  .brand-text h1{ margin:0; font-size:22px; font-weight:700; }
  .brand-text h1 em{ color:var(--gold-bright); font-style:normal; }

  .leaderboard-toggle{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    padding:9px 16px; border-radius:999px; color:var(--text-dim); font-size:13px; font-weight:600;
    transition: border-color .2s, color .2s;
  }
  .leaderboard-toggle:hover{ border-color:var(--gold); color:var(--text); }

  /* ---------- Progress rail ---------- */
  .rail{
    display:flex; align-items:center; justify-content:center;
    gap:0; margin:0 0 40px; flex-wrap:wrap;
  }
  .rail-step{ display:flex; align-items:center; gap:10px; }
  .rail-dot{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px; font-weight:800;
    background:var(--surface); border:1px solid var(--border-bright); color:var(--text-faint);
    transition: all .35s ease;
  }
  .rail-label{ font-size:12.5px; color:var(--text-faint); font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
  .rail-line{ width:44px; height:2px; background:var(--border-bright); margin:0 10px; }
  .rail-step.active .rail-dot{ background:linear-gradient(135deg, var(--teal), var(--teal-dim)); color:#04211f; border-color:transparent; box-shadow:0 0 0 4px rgba(34,195,182,0.15); }
  .rail-step.active .rail-label{ color:var(--text); }
  .rail-step.done .rail-dot{ background:var(--gold); color:#3a2b06; border-color:transparent; }
  .rail-step.done .rail-label{ color:var(--gold-bright); }

  .stage{ animation: fadeUp .5s ease both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .panel{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- Form ---------- */
  .hero{ text-align:center; max-width:640px; margin:0 auto 40px; }
  .hero .eyebrow{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--teal); font-weight:700; margin-bottom:14px; }
  .hero h2{ font-size:clamp(30px,4.5vw,44px); margin:0 0 14px; line-height:1.1; }
  .hero p{ color:var(--text-dim); font-size:16px; margin:0; }

  .form-panel{ padding:38px clamp(20px,4vw,46px); }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px 24px; }
  .field{ display:flex; flex-direction:column; gap:8px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:13px; font-weight:700; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .field label .req{ color:var(--gold); }
  .field input, .field textarea{
    background:rgba(7,17,41,0.55);
    border:1px solid var(--border-bright);
    border-radius:12px;
    padding:13px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    resize:vertical;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--text-faint); }
  .field input:focus, .field textarea:focus{ border-color:var(--teal); box-shadow:0 0 0 4px rgba(34,195,182,0.12); outline:none; }
  .field .hint{ font-size:11.5px; color:var(--text-faint); }

  .form-actions{ margin-top:30px; display:flex; justify-content:flex-end; gap:12px; }

  .btn{
    border:none; border-radius:12px; padding:13px 24px; font-weight:700; font-size:14.5px;
    display:inline-flex; align-items:center; gap:9px; transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#2b2005; box-shadow:0 10px 26px rgba(212,175,55,0.28); }
  .btn-primary:hover{ filter:brightness(1.06); box-shadow:0 12px 30px rgba(212,175,55,0.38); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; filter:none; box-shadow:none; }
  .btn-ghost{ background:transparent; border:1px solid var(--border-bright); color:var(--text-dim); }
  .btn-ghost:hover{ border-color:var(--text-dim); color:var(--text); }
  .btn-teal{ background:linear-gradient(135deg, var(--teal), var(--teal-dim)); color:#04211f; }
  .btn-teal:hover{ filter:brightness(1.08); }
  .btn-sm{ padding:9px 16px; font-size:13px; border-radius:10px; }

  /* ---------- Pitch stage ---------- */
  .spotlight-wrap{ position:relative; padding:52px clamp(20px,5vw,60px) 44px; overflow:hidden; }
  .spotlight-cone{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 480px 320px at 50% -10%, rgba(255,255,255,0.10), transparent 65%);
  }
  .pitch-badge{ display:inline-flex; align-items:center; gap:8px; background:rgba(212,175,55,0.12); border:1px solid rgba(212,175,55,0.35); color:var(--gold-bright); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:6px 14px; border-radius:999px; }
  .pitch-title{ font-size:clamp(28px,4vw,42px); margin:18px 0 6px; position:relative; }
  .pitch-ask{ font-size:15px; color:var(--text-dim); margin-bottom:28px; position:relative; }
  .pitch-ask .mono{ color:var(--gold-bright); font-weight:700; }

  .pitch-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; position:relative; }
  .pitch-block{ background:rgba(7,17,41,0.45); border:1px solid var(--border); border-radius:14px; padding:18px 20px; }
  .pitch-block h4{ margin:0 0 8px; font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--teal); }
  .pitch-block p{ margin:0; font-size:14.5px; color:var(--text); }

  .judge-intro-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:0 clamp(20px,5vw,60px) 40px; }
  .judge-card{
    position:relative; border-radius:16px; padding:20px 16px 18px; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    border:1px solid var(--border);
    overflow:hidden;
  }
  .judge-card::before{
    content:''; position:absolute; inset:0; opacity:.5;
    background: radial-gradient(circle at 50% 120%, var(--jc), transparent 65%);
  }
  .judge-emoji{ font-size:34px; position:relative; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4)); }
  .judge-name{ font-weight:800; margin-top:10px; position:relative; font-size:15px; }
  .judge-role{ font-size:11.5px; color:var(--jc); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-top:2px; position:relative; }
  .judge-focus{ font-size:12.5px; color:var(--text-dim); margin-top:8px; position:relative; }

  /* ---------- Q&A ---------- */
  .qa-wrap{ padding:34px clamp(18px,4vw,44px) 40px; }
  .qa-progress{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px;}
  .qa-progress .count{ font-size:12.5px; color:var(--text-faint); font-weight:700; }
  .qa-bar{ height:5px; background:rgba(255,255,255,0.06); border-radius:99px; overflow:hidden; flex:1; margin:0 18px; min-width:120px; }
  .qa-bar-fill{ height:100%; background:linear-gradient(90deg, var(--teal), var(--gold)); transition:width .4s ease; }

  .judge-speaking{ display:flex; gap:18px; align-items:flex-start; margin-bottom:22px; }
  .judge-avatar{
    flex:none; width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:30px;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.14), transparent 60%), var(--jc);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .speech-bubble{
    background:rgba(7,17,41,0.6); border:1px solid var(--border-bright); border-radius:16px; border-top-left-radius:4px;
    padding:16px 20px; flex:1;
  }
  .speech-bubble .who{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--jc); margin-bottom:6px; }
  .speech-bubble .q{ font-size:16.5px; line-height:1.5; }
  .reaction{ margin-top:14px; padding:12px 16px; border-radius:12px; background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.25); font-size:14px; color:var(--text); font-style:italic; animation:fadeUp .4s ease both; }

  .answer-box textarea{ width:100%; min-height:110px; }
  .qa-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }

  /* ---------- Scoring ---------- */
  .score-wrap{ padding:38px clamp(18px,4vw,46px) 44px; }
  .score-row{ display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .score-label{ width:190px; flex:none; font-size:13.5px; font-weight:700; color:var(--text-dim); }
  .score-track{ flex:1; height:14px; border-radius:99px; background:rgba(255,255,255,0.06); overflow:hidden; position:relative; }
  .score-fill{ height:100%; border-radius:99px; width:0%; transition:width 1.1s cubic-bezier(.2,.8,.25,1); background:linear-gradient(90deg, var(--teal), var(--gold)); }
  .score-num{ width:46px; flex:none; text-align:right; font-weight:800; }

  .overall-line{ display:flex; align-items:baseline; justify-content:space-between; margin-top:30px; padding-top:26px; border-top:1px solid var(--border); }
  .overall-line .big{ font-size:15px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .overall-line .val{ font-size:42px; font-weight:800; }

  /* ---------- Verdict ---------- */
  .verdict-wrap{ padding:44px clamp(18px,4vw,50px) 46px; text-align:center; position:relative; overflow:hidden; }
  .dome-outer{
    width:180px;height:180px; margin:0 auto 18px; border-radius:50%;
    background:radial-gradient(circle at 35% 25%, rgba(255,255,255,0.18), rgba(255,255,255,0) 55%), rgba(255,255,255,0.03);
    border:2px solid var(--border-bright);
    position:relative; overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 20px 50px rgba(0,0,0,0.4);
  }
  .dome-liquid{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(180deg, var(--dc-light), var(--dc));
    transition:height 1.4s cubic-bezier(.22,.9,.3,1);
  }
  .dome-liquid::before{
    content:''; position:absolute; top:-8px; left:0; right:0; height:16px;
    background:radial-gradient(ellipse at 50% 50%, var(--dc-light), transparent 70%);
    animation: wave 3.2s ease-in-out infinite;
  }
  @keyframes wave{ 0%,100%{ transform:translateY(0) scaleX(1);} 50%{ transform:translateY(-3px) scaleX(1.03);} }
  .dome-pct{ position:relative; font-size:30px; font-weight:800; z-index:2; height:100%; display:flex; align-items:center; justify-content:center; text-shadow:0 2px 8px rgba(0,0,0,0.5); }

  .verdict-tag{ display:inline-flex; align-items:center; gap:9px; padding:9px 20px; border-radius:999px; font-weight:800; font-size:14px; letter-spacing:.03em; margin-bottom:14px; }
  .verdict-headline{ font-size:clamp(26px,4vw,38px); margin:0 0 8px; }
  .verdict-sub{ color:var(--text-dim); font-size:15px; max-width:520px; margin:0 auto 30px; }

  .deal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:520px; margin:0 auto 30px; }
  .deal-card{ background:rgba(7,17,41,0.5); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .deal-card .k{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); margin-bottom:6px; }
  .deal-card .v{ font-size:21px; font-weight:800; }

  .reasoning{ text-align:left; max-width:640px; margin:0 auto 30px; background:rgba(7,17,41,0.4); border:1px solid var(--border); border-radius:14px; padding:20px 22px; }
  .reasoning h4{ margin:0 0 10px; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--teal); }
  .reasoning p{ margin:0 0 10px; font-size:14.5px; color:var(--text); }
  .reasoning p:last-child{ margin-bottom:0; }

  .verdict-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border-bright); color:var(--text);
    padding:13px 22px; border-radius:12px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:all .3s ease; box-shadow:var(--shadow); z-index:80;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Leaderboard modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(3,8,20,0.72); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-backdrop.show{ display:flex; }
  .modal{ background:var(--surface-2); border:1px solid var(--border-bright); border-radius:18px; max-width:560px; width:100%; max-height:80vh; overflow:auto; padding:26px 26px 22px; box-shadow:var(--shadow); }
  .modal h3{ margin:0 0 4px; font-size:20px; }
  .modal .sub{ color:var(--text-faint); font-size:13px; margin-bottom:18px; }
  .lb-row{ display:flex; align-items:center; gap:14px; padding:12px 4px; border-bottom:1px solid var(--border); }
  .lb-rank{ width:26px; font-weight:800; color:var(--gold-bright); font-family:'JetBrains Mono', monospace; }
  .lb-name{ flex:1; }
  .lb-name .n{ font-weight:700; font-size:14.5px; }
  .lb-name .d{ font-size:12px; color:var(--text-faint); }
  .lb-score{ font-weight:800; font-family:'JetBrains Mono', monospace; }
  .lb-empty{ text-align:center; color:var(--text-faint); padding:30px 10px; font-size:14px; }
  .modal-close{ display:flex; justify-content:flex-end; margin-top:16px; }

  #confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:90; }

  footer.foot{ text-align:center; color:var(--text-faint); font-size:12px; margin-top:50px; }

  @media (max-width:820px){
    .field-grid{ grid-template-columns:1fr; }
    .judge-intro-row{ grid-template-columns:1fr 1fr; }
    .pitch-grid{ grid-template-columns:1fr; }
    .deal-grid{ grid-template-columns:1fr; }
    .score-label{ width:130px; font-size:12px; }
    .rail-line{ width:20px; }
  }
  @media (max-width:520px){
    .judge-intro-row{ grid-template-columns:1fr 1fr; gap:10px; }
    .rail-label{ display:none; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div id="app">
  <div class="brandbar">
    <div class="brand">
      <div class="brand-mark">🦈</div>
      <div class="brand-text">
        <div class="eyebrow">AI Pitch Simulator</div>
        <h1>The <em>Tank</em></h1>
      </div>
    </div>
    <button class="leaderboard-toggle" id="lbToggle">🏆 Leaderboard</button>
  </div>

  <div class="rail" id="rail"></div>

  <div id="stage"></div>

  <footer class="foot">Every judge, question, and score here is generated locally by simulated logic — no data leaves your browser.</footer>
</div>

<div class="modal-backdrop" id="lbModal">
  <div class="modal">
    <h3>🏆 Tank Leaderboard</h3>
    <div class="sub">Ranked by overall score this session</div>
    <div id="lbList"></div>
    <div class="modal-close"><button class="btn btn-ghost btn-sm" id="lbClose">Close</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ===================== DATA ===================== */

  var STAGES = ["Pitch","Q&A","Scoring","Verdict"];

  var JUDGES = [
    {
      id:'vc', name:'Victoria Vance', emoji:'🦈', role:'Venture Capitalist',
      focus:'Market size & scalability', colorVar:'--teal',
      keywords:['scale','scalable','market','million','billion','growth','tam','expand','global','platform'],
      questions:[
        function(idea){ return "You're targeting "+idea.targetAudience+" — what's your realistic total addressable market, and how does "+idea.startupName+" actually capture it at scale?"; },
        function(idea){ return "If a well-funded competitor entered "+idea.targetAudience+"'s space tomorrow, what stops them from crushing you in six months?"; }
      ],
      reactions:{
        thin:["That's thin for a market answer — I need numbers, not vibes.","I was hoping for a bigger picture than that."],
        neutral:["Okay, noted. I'll want more precision on that later.","Fair, but I'm not fully convinced on scale yet."],
        solid:["Now that's the kind of market thinking I like to hear.","Good — you clearly understand your growth surface."],
        impressed:["That's a genuinely scalable answer. I'm leaning in.","You just made the market case better than most founders I see."]
      }
    },
    {
      id:'founder', name:'Marcus Kade', emoji:'🦈', role:'Founder',
      focus:'Execution', colorVar:'--gold',
      keywords:['ship','build','launch','team','roadmap','mvp','execute','hire','sprint','deadline'],
      questions:[
        function(idea){ return "Walk me through the first 90 days after "+idea.fundingAsk+" lands — what actually ships, and what's the single biggest risk to hitting it?"; },
        function(idea){ return "What's the hardest part of actually building "+idea.solution+" that most outsiders underestimate?"; }
      ],
      reactions:{
        thin:["I've shipped enough products to know that answer needs more detail.","That plan wouldn't survive contact with week one."],
        neutral:["It's a start, but execution lives in the specifics.","I need to see you've actually thought through the build."],
        solid:["That's a real plan — you've clearly thought about sequencing.","Good, you know where the execution risk actually sits."],
        impressed:["Now THAT sounds like someone who's actually shipped before.","I'd want you running my engineering team with an answer like that."]
      }
    },
    {
      id:'customer', name:'Priya Anand', emoji:'🦈', role:'Customer',
      focus:'Usefulness', colorVar:'--green',
      keywords:['easy','save','time','simple','solve','help','pain','daily','use','need'],
      questions:[
        function(idea){ return "Why would someone actually switch to "+idea.startupName+" over whatever they use today to deal with "+idea.problemStatement.toLowerCase()+"?"; },
        function(idea){ return "What happens the day I stop using "+idea.startupName+" — do I even notice it's gone?"; }
      ],
      reactions:{
        thin:["Honestly, that doesn't tell me why I'd care.","I don't feel the pain point in that answer.","As a customer, that leaves me unconvinced."],
        neutral:["Okay, I could see using that — but I'm not desperate for it yet.","It's useful-ish. Not a must-have from what you've said."],
        solid:["Alright, that's the kind of everyday value I'd actually pay for.","Now I can picture using this in my week."],
        impressed:["I would genuinely tell my friends about that.","That's the answer that makes me want to use it today."]
      }
    },
    {
      id:'angel', name:'Alexander Cole', emoji:'🦈', role:'Angel Investor',
      focus:'Profitability', colorVar:'--violet',
      keywords:['margin','profit','revenue','subscription','recurring','ltv','cac','unit economics','pricing','arr'],
      questions:[
        function(idea){ return "Your model is "+idea.revenueModel+" — walk me through the unit economics: what does it actually cost you to acquire and serve one customer?"; },
        function(idea){ return "When do you actually turn a profit, and what happens to that timeline if growth comes in at half your projection?"; }
      ],
      reactions:{
        thin:["Those numbers don't add up to a fundable business yet.","I need real unit economics, not hope.","That's not an answer an angel can write a check against."],
        neutral:["Okay. I'll want a sharper model before I commit, though.","There's something here, but the margins aren't proven yet."],
        solid:["Now we're talking real numbers — I like that.","That's a business model with actual teeth."],
        impressed:["That's exactly the kind of unit economics that gets a check written.","Now that is a profitable-looking machine."]
      }
    }
  ];

  var MARKET_KW=['scale','scalable','market','million','billion','growth','global','platform','demand','expand'];
  var INNOVATE_KW=['unique','first','ai','automat','novel','proprietary','patent','differen','only platform','never before'];
  var BIZ_KW=['subscription','recurring','margin','revenue','saas','commission','licensing','freemium','pricing','arr'];
  var EXEC_KW=['team','roadmap','ship','launch','mvp','experience','built','hire','pilot','partnership'];
  var INVEST_KW=['traction','users','revenue','growth','pilot','waitlist','customers','signed','pipeline','retention'];

  /* ===================== STATE ===================== */

  var state = {
    step:0, // 0 form, 1 pitch, 2 qa, 3 scoring, 4 verdict
    idea:{},
    qaIndex:0, // 0..7 across 4 judges x 2 q
    answers:[], // {judgeId, question, answer, reaction, category}
    scores:{market:0, innovation:0, business:0, execution:0, investment:0},
    decision:null,
    leaderboard:[]
  };

  var QA_SEQUENCE = [];
  JUDGES.forEach(function(j){
    j.questions.forEach(function(qFn, qi){ QA_SEQUENCE.push({judge:j, qIndex:qi, qFn:qFn}); });
  });

  /* ===================== HELPERS ===================== */

  function $(sel, ctx){ return (ctx||document).querySelector(sel); }
  function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function esc(str){ var d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
  function wordCount(str){ return (str||'').trim().length ? (str.trim().match(/\S+/g)||[]).length : 0; }

  function showToast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function detectCurrency(str){
    str = str||'';
    if(str.indexOf('₹')>-1 || /\brs\.?\b/i.test(str) || /\binr\b/i.test(str) || /lakh|crore|\bcr\b/i.test(str)) return 'inr';
    if(str.indexOf('$')>-1 || /\busd\b/i.test(str)) return 'usd';
    if(str.indexOf('€')>-1) return 'eur';
    return 'usd';
  }

  function parseAmount(str){
    str = (str||'').toLowerCase();
    var numMatch = str.match(/[\d][\d,\.]*/);
    var num = numMatch ? parseFloat(numMatch[0].replace(/,/g,'')) : 0;
    if(!num) return 0;
    if(/crore|\bcr\b/.test(str)) return num*1e7;
    if(/lakh|\blac\b|\bl\b/.test(str)) return num*1e5;
    if(/billion|\bb\b/.test(str)) return num*1e9;
    if(/million|\bm\b/.test(str)) return num*1e6;
    if(/thousand|\bk\b/.test(str)) return num*1e3;
    return num;
  }

  function formatCurrency(num, currency){
    num = Math.round(num);
    if(currency==='inr'){
      if(num>=1e7) return '₹'+(num/1e7).toFixed(2).replace(/\.00$/,'')+' Cr';
      if(num>=1e5) return '₹'+(num/1e5).toFixed(2).replace(/\.00$/,'')+' L';
      if(num>=1e3) return '₹'+(num/1e3).toFixed(1).replace(/\.0$/,'')+'K';
      return '₹'+num;
    }
    var sym = currency==='eur' ? '€' : '$';
    if(num>=1e9) return sym+(num/1e9).toFixed(2).replace(/\.00$/,'')+'B';
    if(num>=1e6) return sym+(num/1e6).toFixed(2).replace(/\.00$/,'')+'M';
    if(num>=1e3) return sym+(num/1e3).toFixed(1).replace(/\.0$/,'')+'K';
    return sym+num;
  }

  function fieldScore(text, keywords){
    text = text||'';
    var words = wordCount(text);
    var base = Math.min(50, words*2.2);
    var lower = text.toLowerCase();
    var hits = keywords.filter(function(k){ return lower.indexOf(k)>-1; }).length;
    base += Math.min(25, hits*8);
    base += Math.random()*15;
    return clamp(Math.round(base), 12, 100);
  }

  function answerFor(judgeId, qIndex){
    var f = state.answers.filter(function(a){ return a.judgeId===judgeId && a.qIndex===qIndex; })[0];
    return f ? f.answer : '';
  }
  function combinedAnswers(judgeId){
    return state.answers.filter(function(a){ return a.judgeId===judgeId; }).map(function(a){ return a.answer; }).join(' ');
  }

  function reactionCategory(judge, text){
    var wc = wordCount(text);
    var lower = (text||'').toLowerCase();
    var hasKw = judge.keywords.some(function(k){ return lower.indexOf(k)>-1; });
    if(wc < 8) return 'thin';
    if(wc >= 22 && hasKw) return 'impressed';
    if(wc >= 14) return 'solid';
    return 'neutral';
  }

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ===================== RENDER: RAIL ===================== */

  function renderRail(){
    var rail = $('#rail'); rail.innerHTML='';
    STAGES.forEach(function(label, i){
      if(i>0){ rail.appendChild(el('div','rail-line')); }
      var wrap = el('div','rail-step'+(state.step===i+1? ' active': state.step> i+1 || (state.step===4 && i===3) ? ' done':''));
      if(i+1 < state.step) wrap.className = 'rail-step done';
      if(i+1 === state.step) wrap.className = 'rail-step active';
      wrap.appendChild(el('div','rail-dot', i+1<state.step ? '✓' : String(i+1)));
      wrap.appendChild(el('div','rail-label', label));
      rail.appendChild(wrap);
    });
  }

  /* ===================== STEP 0: FORM ===================== */

  function renderForm(){
    var s = el('div','stage');
    s.innerHTML =
      '<div class="hero">'+
        '<div class="eyebrow">Round 1 of 4</div>'+
        '<h2 class="display">Step into <em style="color:var(--gold-bright)">The Tank</em></h2>'+
        '<p>Pitch your startup to four AI sharks. Answer their questions, take the heat, and walk out with a term sheet — or a life lesson.</p>'+
      '</div>'+
      '<div class="panel form-panel">'+
        '<div class="field-grid">'+
          field('startupName','Startup Name','input','e.g. NimbusCart','text', true)+
          field('fundingAsk','Funding Ask','input','e.g. ₹50 Lakhs for 8% equity','text', true)+
          field('problemStatement','Problem Statement','textarea','What painful, real problem are you solving, and for whom?','', true, true)+
          field('solution','Solution','textarea','How does your product actually solve it? What makes it work?','', true, true)+
          field('revenueModel','Revenue Model','textarea','How do you make money — subscriptions, commission, licensing…?','', true, true)+
          field('targetAudience','Target Audience','textarea','Who exactly is your first customer? Be specific.','', true, true)+
        '</div>'+
        '<div class="form-actions">'+
          '<button class="btn btn-primary" id="startPitch">Enter the Tank 🦈</button>'+
        '</div>'+
      '</div>';
    return s;

    function field(id,label,type,placeholder,inputType,required,full){
      var reqMark = required ? ' <span class="req">*</span>' : '';
      var control = type==='textarea'
        ? '<textarea id="'+id+'" rows="3" placeholder="'+esc(placeholder)+'">'+esc(state.idea[id]||'')+'</textarea>'
        : '<input id="'+id+'" type="'+(inputType||'text')+'" placeholder="'+esc(placeholder)+'" value="'+esc(state.idea[id]||'')+'">';
      return '<div class="field'+(full?' full':'')+'"><label for="'+id+'">'+label+reqMark+'</label>'+control+'</div>';
    }
  }

  function bindForm(root){
    $('#startPitch', root).addEventListener('click', function(){
      var ids = ['startupName','fundingAsk','problemStatement','solution','revenueModel','targetAudience'];
      var idea = {};
      var missing = [];
      ids.forEach(function(id){
        var v = $('#'+id, root).value.trim();
        idea[id] = v;
        if(!v) missing.push(id);
      });
      if(missing.length){
        showToast('Fill in every field before you step on stage.');
        var firstMissing = $('#'+missing[0], root);
        firstMissing.focus();
        firstMissing.style.borderColor = 'var(--red)';
        return;
      }
      state.idea = idea;
      state.step = 1;
      state.qaIndex = 0;
      state.answers = [];
      goTo(renderPitch, bindPitch);
    });
  }

  /* ===================== STEP 1: PITCH ===================== */

  function renderPitch(){
    var idea = state.idea;
    var s = el('div','stage');
    var judgeCards = JUDGES.map(function(j){
      return '<div class="judge-card" style="--jc:var('+j.colorVar+')">'+
        '<div class="judge-emoji">'+j.emoji+'</div>'+
        '<div class="judge-name">'+esc(j.name)+'</div>'+
        '<div class="judge-role">'+esc(j.role)+'</div>'+
        '<div class="judge-focus">Focused on '+esc(j.focus)+'</div>'+
      '</div>';
    }).join('');

    s.innerHTML =
      '<div class="panel">'+
        '<div class="spotlight-wrap">'+
          '<div class="spotlight-cone"></div>'+
          '<span class="pitch-badge">🎤 The Pitch</span>'+
          '<h2 class="pitch-title display">'+esc(idea.startupName)+'</h2>'+
          '<div class="pitch-ask">Asking the tank for <span class="mono">'+esc(idea.fundingAsk)+'</span></div>'+
          '<div class="pitch-grid">'+
            block('The Problem', idea.problemStatement)+
            block('The Solution', idea.solution)+
            block('Revenue Model', idea.revenueModel)+
            block('Target Audience', idea.targetAudience)+
          '</div>'+
        '</div>'+
        '<div class="judge-intro-row">'+judgeCards+'</div>'+
        '<div class="form-actions" style="padding:0 clamp(18px,4vw,44px) 30px;">'+
          '<button class="btn btn-ghost" id="backToForm">← Edit pitch</button>'+
          '<button class="btn btn-primary" id="beginQA">Face the sharks →</button>'+
        '</div>'+
      '</div>';
    return s;

    function block(title, text){
      return '<div class="pitch-block"><h4>'+title+'</h4><p>'+esc(text)+'</p></div>';
    }
  }

  function bindPitch(root){
    $('#backToForm', root).addEventListener('click', function(){ state.step=0; goTo(renderForm, bindForm); });
    $('#beginQA', root).addEventListener('click', function(){
      state.step = 2; state.qaIndex = 0;
      goTo(renderQA, bindQA);
    });
  }

  /* ===================== STEP 2: Q&A ===================== */

  function renderQA(){
    var s = el('div','stage');
    var item = QA_SEQUENCE[state.qaIndex];
    var judge = item.judge;
    var question = item.qFn(state.idea);
    var existing = state.answers[state.qaIndex];
    var pct = Math.round((state.qaIndex/(QA_SEQUENCE.length))*100);

    s.innerHTML =
      '<div class="panel qa-wrap">'+
        '<div class="qa-progress">'+
          '<div class="count">Question '+(state.qaIndex+1)+' of '+QA_SEQUENCE.length+'</div>'+
          '<div class="qa-bar"><div class="qa-bar-fill" style="width:'+pct+'%"></div></div>'+
          '<div class="count">'+judge.role+'</div>'+
        '</div>'+
        '<div class="judge-speaking">'+
          '<div class="judge-avatar" style="--jc:var('+judge.colorVar+')">'+judge.emoji+'</div>'+
          '<div class="speech-bubble">'+
            '<div class="who" style="color:var('+judge.colorVar+')">'+esc(judge.name)+' • '+esc(judge.role)+'</div>'+
            '<div class="q">"'+esc(question)+'"</div>'+
            (existing && existing.reaction ? '<div class="reaction">🦈 "'+esc(existing.reaction)+'"</div>' : '')+
          '</div>'+
        '</div>'+
        '<div class="answer-box">'+
          '<textarea id="answerInput" placeholder="Make your case to '+esc(judge.name)+'…">'+esc(existing?existing.answer:'')+'</textarea>'+
        '</div>'+
        '<div class="qa-actions">'+
          (state.qaIndex>0 ? '<button class="btn btn-ghost" id="qaBack">← Previous</button>' : '')+
          '<button class="btn btn-teal" id="qaSubmit">'+(existing? 'Update & Continue' : 'Respond')+'</button>'+
        '</div>'+
      '</div>';
    return s;
  }

  function bindQA(root){
    var backBtn = $('#qaBack', root);
    if(backBtn){
      backBtn.addEventListener('click', function(){
        state.qaIndex = Math.max(0, state.qaIndex-1);
        goTo(renderQA, bindQA);
      });
    }
    $('#qaSubmit', root).addEventListener('click', function(){
      var ta = $('#answerInput', root);
      var text = ta.value.trim();
      if(!text){ showToast('Give the shark something to work with.'); ta.focus(); return; }

      var item = QA_SEQUENCE[state.qaIndex];
      var judge = item.judge;
      var cat = reactionCategory(judge, text);
      var reaction = pick(judge.reactions[cat]);

      var record = { judgeId:judge.id, judgeName:judge.name, question: item.qFn(state.idea), qIndex:item.qIndex, answer:text, reaction:reaction, category:cat };
      state.answers[state.qaIndex] = record;

      // show reaction first, then advance
      var reactDiv = document.createElement('div');
      reactDiv.className='reaction';
      reactDiv.innerHTML = '🦈 "'+esc(reaction)+'"';
      var bubble = $('.speech-bubble', root);
      var oldReact = $('.reaction', bubble);
      if(oldReact) oldReact.remove();
      bubble.appendChild(reactDiv);
      $('#qaSubmit', root).textContent = state.qaIndex < QA_SEQUENCE.length-1 ? 'Next question →' : 'See my scores →';
      $('#qaSubmit', root).onclick = function(){ advanceQA(); };
    });
  }

  function advanceQA(){
    if(state.qaIndex < QA_SEQUENCE.length-1){
      state.qaIndex++;
      goTo(renderQA, bindQA);
    } else {
      computeScores();
      state.step = 3;
      goTo(renderScoring, bindScoring, true);
    }
  }

  /* ===================== SCORING ===================== */

  function computeScores(){
    var idea = state.idea;
    var market = Math.round((fieldScore(idea.targetAudience, MARKET_KW) + fieldScore(combinedAnswers('vc'), MARKET_KW)) / 2);
    var innovation = Math.round((fieldScore(idea.solution, INNOVATE_KW) + fieldScore(combinedAnswers('customer'), INNOVATE_KW)) / 2);
    var business = Math.round((fieldScore(idea.revenueModel, BIZ_KW) + fieldScore(combinedAnswers('angel'), BIZ_KW)) / 2);
    var execution = Math.round((fieldScore(idea.problemStatement+' '+idea.solution, EXEC_KW)*0.4 + fieldScore(combinedAnswers('founder'), EXEC_KW)*0.6));
    var investment = Math.round(market*0.25 + innovation*0.2 + business*0.3 + execution*0.25 + (Math.random()*6-3));

    state.scores = {
      market: clamp(market,0,100),
      innovation: clamp(innovation,0,100),
      business: clamp(business,0,100),
      execution: clamp(execution,0,100),
      investment: clamp(investment,0,100)
    };
  }

  function renderScoring(){
    var s = el('div','stage');
    var sc = state.scores;
    var overall = Math.round((sc.market+sc.innovation+sc.business+sc.execution+sc.investment)/5);
    var rows = [
      ['Market Potential', sc.market],
      ['Innovation', sc.innovation],
      ['Business Model', sc.business],
      ['Execution', sc.execution],
      ['Investment Worthiness', sc.investment]
    ];
    s.innerHTML =
      '<div class="panel score-wrap">'+
        '<div class="hero" style="margin-bottom:30px;">'+
          '<div class="eyebrow">Round 3 of 4</div>'+
          '<h2 class="display">The Sharks Are Scoring</h2>'+
          '<p>Every answer you gave just moved these needles.</p>'+
        '</div>'+
        '<div id="scoreRows">'+
          rows.map(function(r,i){
            return '<div class="score-row"><div class="score-label">'+r[0]+'</div>'+
              '<div class="score-track"><div class="score-fill" data-target="'+r[1]+'" id="fill'+i+'"></div></div>'+
              '<div class="score-num mono" id="num'+i+'">0</div></div>';
          }).join('')+
        '</div>'+
        '<div class="overall-line">'+
          '<div class="big">Overall Tank Score</div>'+
          '<div class="val mono" id="overallVal">0</div>'+
        '</div>'+
        '<div class="form-actions">'+
          '<button class="btn btn-primary" id="revealVerdict">Reveal the Verdict →</button>'+
        '</div>'+
      '</div>';

    setTimeout(function(){
      rows.forEach(function(r,i){
        var fill = document.getElementById('fill'+i);
        var num = document.getElementById('num'+i);
        fill.style.width = r[1]+'%';
        animateNum(num, r[1]);
      });
      animateNum(document.getElementById('overallVal'), overall);
    }, 120);

    return s;
  }

  function animateNum(node, target){
    var start = 0; var dur = 900; var t0 = performance.now();
    function step(t){
      var p = clamp((t-t0)/dur, 0, 1);
      var eased = 1 - Math.pow(1-p, 3);
      node.textContent = Math.round(start + (target-start)*eased);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function bindScoring(root){
    $('#revealVerdict', root).addEventListener('click', function(){
      computeDecision();
      state.step = 4;
      goTo(renderVerdict, bindVerdict, true);
    });
  }

  /* ===================== DECISION ===================== */

  function computeDecision(){
    var sc = state.scores;
    var overall = Math.round((sc.market+sc.innovation+sc.business+sc.execution+sc.investment)/5);
    var currency = detectCurrency(state.idea.fundingAsk);
    var askAmount = parseAmount(state.idea.fundingAsk) || 1000000;

    var type, equityPct, fundingAmount, valuation;

    if(overall >= 76){
      type = 'invest';
      equityPct = clamp(24 - (overall-76)*0.6, 8, 22);
      fundingAmount = askAmount;
      valuation = fundingAmount / (equityPct/100);
    } else if(overall >= 60){
      type = 'acquire';
      equityPct = clamp(30 - (overall-60)*0.4, 15, 30);
      fundingAmount = askAmount * (0.6 + Math.random()*0.5);
      valuation = fundingAmount / (equityPct/100);
    } else if(overall >= 44){
      type = 'later';
      equityPct = null;
      fundingAmount = 0;
      valuation = askAmount / 0.15;
    } else {
      type = 'reject';
      equityPct = null;
      fundingAmount = 0;
      valuation = 0;
    }

    var scoreEntries = [
      ['Market Potential', sc.market], ['Innovation', sc.innovation],
      ['Business Model', sc.business], ['Execution', sc.execution],
      ['Investment Worthiness', sc.investment]
    ];
    scoreEntries.sort(function(a,b){ return b[1]-a[1]; });
    var strongest = scoreEntries[0];
    var weakest = scoreEntries[scoreEntries.length-1];

    var reasoning = buildReasoning(type, strongest, weakest, overall);

    state.decision = {
      type: type, overall: overall, currency: currency,
      equityPct: equityPct, fundingAmount: fundingAmount, valuation: valuation,
      strongest: strongest, weakest: weakest, reasoning: reasoning
    };
  }

  function buildReasoning(type, strongest, weakest, overall){
    var idea = state.idea;
    var lines = [];
    var strongLine = idea.startupName+"'s strongest signal was "+strongest[0].toLowerCase()+" at "+strongest[1]+"/100.";
    var weakLine = "The clearest gap was "+weakest[0].toLowerCase()+", scoring "+weakest[1]+"/100 — that's the first thing to fix.";

    if(type==='invest'){
      lines.push("The panel is convinced. "+strongLine+" Combined with solid answers under pressure, this cleared the bar for a check.");
      lines.push(weakLine+" Still, the overall picture at "+overall+"/100 is fundable today.");
      lines.push("Expect the sharks to want board visibility and a clear path to the next milestone before the next round.");
    } else if(type==='acquire'){
      lines.push("The sharks like what's underneath the hood more than the pitch itself. "+strongLine);
      lines.push(weakLine+" Rather than fund the current plan, the tank prefers to bring "+idea.startupName+" in-house and fix that gap directly.");
      lines.push("This is a vote of confidence in the asset, not (yet) in the standalone business.");
    } else if(type==='later'){
      lines.push("There's real potential here, but it isn't provable yet. "+strongLine);
      lines.push(weakLine+" At "+overall+"/100 overall, the panel wants to see traction before committing capital.");
      lines.push("Come back in 3–6 months with sharper numbers on the weak spot and this conversation goes very differently.");
    } else {
      lines.push("This didn't clear the bar tonight. "+weakLine);
      lines.push("Even the best score, "+strongLine.toLowerCase().replace(idea.startupName.toLowerCase()+"'s strongest signal was ",""), "wasn't enough to offset the rest of the picture at "+overall+"/100.");
      lines.push("That's not a verdict on the founder — it's a verdict on this specific pitch, today.");
    }
    return lines.filter(Boolean);
  }

  /* ===================== VERDICT ===================== */

  var DECISION_META = {
    invest: { label:"They're In", tagBg:'rgba(67,201,127,0.15)', tagBorder:'rgba(67,201,127,0.4)', tagColor:'var(--green)', dcVar:'--green', dcLight:'#7be3ab', emoji:'🤝' },
    acquire:{ label:'Acquisition Offer', tagBg:'rgba(155,140,255,0.15)', tagBorder:'rgba(155,140,255,0.4)', tagColor:'var(--violet)', dcVar:'--violet', dcLight:'#c3b8ff', emoji:'🏷️' },
    later:  { label:"Come Back Later", tagBg:'rgba(212,175,55,0.15)', tagBorder:'rgba(212,175,55,0.4)', tagColor:'var(--gold-bright)', dcVar:'--gold', dcLight:'#f6da8f', emoji:'⏳' },
    reject: { label:"I'm Out", tagBg:'rgba(229,72,77,0.15)', tagBorder:'rgba(229,72,77,0.4)', tagColor:'var(--red)', dcVar:'--red', dcLight:'#ff9a9d', emoji:'❌' }
  };

  function renderVerdict(){
    var d = state.decision;
    var meta = DECISION_META[d.type];
    var idea = state.idea;
    var s = el('div','stage');

    var dealCards = '';
    if(d.type==='invest' || d.type==='acquire'){
      dealCards =
        '<div class="deal-grid">'+
          '<div class="deal-card"><div class="k">'+(d.type==='invest'?'Funding Amount':'Offer Amount')+'</div><div class="v">'+formatCurrency(d.fundingAmount, d.currency)+'</div></div>'+
          '<div class="deal-card"><div class="k">Implied Valuation</div><div class="v">'+formatCurrency(d.valuation, d.currency)+'</div></div>'+
          '<div class="deal-card"><div class="k">Equity Requested</div><div class="v">'+d.equityPct.toFixed(1)+'%</div></div>'+
          '<div class="deal-card"><div class="k">Overall Score</div><div class="v">'+d.overall+'/100</div></div>'+
        '</div>';
    } else {
      dealCards =
        '<div class="deal-grid">'+
          '<div class="deal-card"><div class="k">Overall Score</div><div class="v">'+d.overall+'/100</div></div>'+
          '<div class="deal-card"><div class="k">Reference Valuation</div><div class="v">'+formatCurrency(d.valuation, d.currency)+'</div></div>'+
        '</div>';
    }

    s.innerHTML =
      '<div class="panel verdict-wrap" style="--dc:var('+meta.dcVar+'); --dc-light:'+meta.dcLight+';">'+
        '<div class="dome-outer"><div class="dome-liquid" id="domeLiquid"></div><div class="dome-pct mono" id="domePct">0%</div></div>'+
        '<span class="verdict-tag" style="background:'+meta.tagBg+'; border:1px solid '+meta.tagBorder+'; color:'+meta.tagColor+';">'+meta.emoji+' '+meta.label+'</span>'+
        '<h2 class="verdict-headline display">'+esc(idea.startupName)+"'s Fate: "+meta.label+'</h2>'+
        '<p class="verdict-sub">Four sharks, eight questions, one overall score of '+d.overall+'/100.</p>'+
        dealCards+
        '<div class="reasoning"><h4>Why the tank decided this</h4>'+d.reasoning.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+'</div>'+
        '<div class="verdict-actions">'+
          '<button class="btn btn-primary" id="downloadReport">📄 Download Pitch Report</button>'+
          '<button class="btn btn-teal" id="shareResult">🔗 Share Result</button>'+
          '<button class="btn btn-ghost" id="viewLeaderboard">🏆 Leaderboard</button>'+
          '<button class="btn btn-ghost" id="restartSim">🔁 New Pitch</button>'+
        '</div>'+
      '</div>';

    setTimeout(function(){
      var liquid = document.getElementById('domeLiquid');
      var pctNode = document.getElementById('domePct');
      liquid.style.height = d.overall+'%';
      animateNum(pctNode, d.overall);
      var interval = setInterval(function(){ pctNode.textContent = pctNode.textContent; }, 50);
      setTimeout(function(){ clearInterval(interval); pctNode.textContent = d.overall+'%'; }, 1000);
    }, 150);

    // leaderboard entry
    state.leaderboard.push({
      name: idea.startupName, overall: d.overall, decision: meta.label, ts: Date.now()
    });

    if(d.type==='invest' || d.type==='acquire'){
      setTimeout(function(){ fireConfetti(); }, 400);
    }

    return s;
  }

  function bindVerdict(root){
    $('#downloadReport', root).addEventListener('click', downloadReport);
    $('#shareResult', root).addEventListener('click', shareResult);
    $('#viewLeaderboard', root).addEventListener('click', openLeaderboard);
    $('#restartSim', root).addEventListener('click', function(){
      state = { step:0, idea:{}, qaIndex:0, answers:[], scores:{market:0,innovation:0,business:0,execution:0,investment:0}, decision:null, leaderboard: state.leaderboard };
      goTo(renderForm, bindForm);
    });
  }

  /* ===================== ROUTER ===================== */

  function goTo(renderFn, bindFn, skipAnim){
    renderRail();
    var stageWrap = $('#stage');
    stageWrap.innerHTML='';
    var node = renderFn();
    if(skipAnim) node.style.animation='none';
    stageWrap.appendChild(node);
    if(bindFn) bindFn(node);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ===================== LEADERBOARD ===================== */

  function openLeaderboard(){
    var list = $('#lbList');
    var sorted = state.leaderboard.slice().sort(function(a,b){ return b.overall-a.overall; }).slice(0,10);
    if(!sorted.length){
      list.innerHTML = '<div class="lb-empty">No pitches yet this session. Take the stage!</div>';
    } else {
      list.innerHTML = sorted.map(function(row, i){
        return '<div class="lb-row"><div class="lb-rank">#'+(i+1)+'</div>'+
          '<div class="lb-name"><div class="n">'+esc(row.name)+'</div><div class="d">'+esc(row.decision)+'</div></div>'+
          '<div class="lb-score mono">'+row.overall+'</div></div>';
      }).join('');
    }
    $('#lbModal').classList.add('show');
  }
  $('#lbToggle').addEventListener('click', openLeaderboard);
  $('#lbClose').addEventListener('click', function(){ $('#lbModal').classList.remove('show'); });
  $('#lbModal').addEventListener('click', function(e){ if(e.target.id==='lbModal') $('#lbModal').classList.remove('show'); });

  /* ===================== SHARE ===================== */

  function shareResult(){
    var d = state.decision, idea = state.idea;
    var meta = DECISION_META[d.type];
    var text = idea.startupName+' just left The Tank with a verdict: '+meta.label+' — overall score '+d.overall+'/100. 🦈';
    if(navigator.share){
      navigator.share({ title:'The Tank — AI Pitch Simulator', text: text }).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){ showToast('Result copied to clipboard!'); })
        .catch(function(){ showToast(text); });
    } else {
      showToast(text);
    }
  }

  /* ===================== PDF REPORT ===================== */

  function downloadReport(){
    var idea = state.idea, d = state.decision, sc = state.scores, meta = DECISION_META[d.type];
    try{
      var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
      if(!jsPDFCtor) throw new Error('jsPDF unavailable');
      var doc = new jsPDFCtor({ unit:'pt', format:'a4' });
      var W = doc.internal.pageSize.getWidth();
      var margin = 48; var y = 60; var lh = 16;

      function heading(text, size){ doc.setFont('helvetica','bold'); doc.setFontSize(size||14); doc.setTextColor(20,30,50); doc.text(text, margin, y); y+=size?size*1.4:22; }
      function body(text, size){
        doc.setFont('helvetica','normal'); doc.setFontSize(size||10.5); doc.setTextColor(60,70,90);
        var lines = doc.splitTextToSize(text, W-margin*2);
        lines.forEach(function(line){
          if(y > 760){ doc.addPage(); y = 60; }
          doc.text(line, margin, y); y += lh;
        });
        y += 6;
      }
      function rule(){ doc.setDrawColor(210,210,220); doc.line(margin, y, W-margin, y); y+=16; }

      doc.setFillColor(7,17,41); doc.rect(0,0,W,90,'F');
      doc.setTextColor(242,201,76); doc.setFont('helvetica','bold'); doc.setFontSize(20);
      doc.text('THE TANK — PITCH REPORT', margin, 44);
      doc.setTextColor(200,210,225); doc.setFont('helvetica','normal'); doc.setFontSize(11);
      doc.text(idea.startupName+'  •  Generated '+new Date().toLocaleDateString(), margin, 64);
      y = 118;

      heading('Startup Overview', 15);
      body('Startup Name: '+idea.startupName);
      body('Funding Ask: '+idea.fundingAsk);
      body('Problem Statement: '+idea.problemStatement);
      body('Solution: '+idea.solution);
      body('Revenue Model: '+idea.revenueModel);
      body('Target Audience: '+idea.targetAudience);
      rule();

      heading('Judge Q&A', 15);
      state.answers.forEach(function(a){
        body(a.judgeName+' asked: "'+a.question+'"', 10.5);
        body('Answer: '+a.answer, 10.5);
        body('Reaction: "'+a.reaction+'"', 10.5);
        y += 4;
      });
      rule();

      heading('Scorecard', 15);
      body('Market Potential: '+sc.market+'/100');
      body('Innovation: '+sc.innovation+'/100');
      body('Business Model: '+sc.business+'/100');
      body('Execution: '+sc.execution+'/100');
      body('Investment Worthiness: '+sc.investment+'/100');
      body('Overall Score: '+d.overall+'/100');
      rule();

      heading('Verdict: '+meta.label, 15);
      if(d.type==='invest' || d.type==='acquire'){
        body('Funding / Offer Amount: '+formatCurrency(d.fundingAmount, d.currency));
        body('Implied Valuation: '+formatCurrency(d.valuation, d.currency));
        body('Equity Requested: '+d.equityPct.toFixed(1)+'%');
      }
      d.reasoning.forEach(function(p){ body(p); });

      doc.save((idea.startupName||'pitch').replace(/[^a-z0-9]+/gi,'_')+'_tank_report.pdf');
      showToast('Pitch report downloaded.');
    } catch(err){
      printFallback(idea, d, sc, meta);
    }
  }

  function printFallback(idea, d, sc, meta){
    var w = window.open('', '_blank');
    if(!w){ showToast("Enable pop-ups to download the report."); return; }
    var qa = state.answers.map(function(a){
      return '<p><strong>'+esc(a.judgeName)+' asked:</strong> "'+esc(a.question)+'"<br><strong>Answer:</strong> '+esc(a.answer)+'<br><em>Reaction: "'+esc(a.reaction)+'"</em></p>';
    }).join('');
    var dealHtml = (d.type==='invest'||d.type==='acquire') ?
      '<p><strong>Funding/Offer:</strong> '+formatCurrency(d.fundingAmount,d.currency)+' &nbsp; <strong>Valuation:</strong> '+formatCurrency(d.valuation,d.currency)+' &nbsp; <strong>Equity:</strong> '+d.equityPct.toFixed(1)+'%</p>' : '';
    w.document.write(
      '<html><head><title>'+esc(idea.startupName)+' — Pitch Report</title>'+
      '<style>body{font-family:Georgia,serif;max-width:720px;margin:40px auto;color:#111;} h1{color:#7a5c00;} h2{border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:32px;}</style></head><body>'+
      '<h1>The Tank — Pitch Report</h1><h2>'+esc(idea.startupName)+'</h2>'+
      '<p><strong>Funding Ask:</strong> '+esc(idea.fundingAsk)+'</p>'+
      '<p><strong>Problem:</strong> '+esc(idea.problemStatement)+'</p>'+
      '<p><strong>Solution:</strong> '+esc(idea.solution)+'</p>'+
      '<p><strong>Revenue Model:</strong> '+esc(idea.revenueModel)+'</p>'+
      '<p><strong>Target Audience:</strong> '+esc(idea.targetAudience)+'</p>'+
      '<h2>Judge Q&A</h2>'+qa+
      '<h2>Scorecard</h2>'+
      '<p>Market Potential: '+sc.market+'/100<br>Innovation: '+sc.innovation+'/100<br>Business Model: '+sc.business+'/100<br>Execution: '+sc.execution+'/100<br>Investment Worthiness: '+sc.investment+'/100<br><strong>Overall: '+d.overall+'/100</strong></p>'+
      '<h2>Verdict: '+esc(meta.label)+'</h2>'+dealHtml+
      d.reasoning.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+
      '<script>window.print();<\/script></body></html>'
    );
    w.document.close();
  }

  /* ===================== CONFETTI ===================== */

  function fireConfetti(){
    var canvas = document.getElementById('confetti-canvas');
    var ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var colors = ['#D4AF37','#F2C94C','#22C3B6','#43C97F','#9B8CFF','#EAF0F7'];
    var pieces = [];
    for(var i=0;i<160;i++){
      pieces.push({
        x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.5,
        w: 6+Math.random()*6, h: 8+Math.random()*10,
        vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
        rot: Math.random()*360, vr: -6+Math.random()*12,
        color: colors[Math.floor(Math.random()*colors.length)]
      });
    }
    var start = performance.now();
    function frame(t){
      var elapsed = t-start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      });
      if(elapsed < 3600){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      }
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function(){
    var c = document.getElementById('confetti-canvas');
    c.width = window.innerWidth; c.height = window.innerHeight;
  });

  /* ===================== INIT ===================== */

  goTo(renderForm, bindForm, true);

})();
</script>
